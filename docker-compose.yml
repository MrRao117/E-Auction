services:
  # MySQL Database Container
  mysql:
    image: mysql:8.0
    container_name: mysql-E_auction
    environment:
      MYSQL_DATABASE: e_auction_dev
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  # Redis Container
  redis:
    image: redis:latest
    container_name: redis-E_auction
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Apache Kafka Container (KRaft mode)
  kafka:
    image: apache/kafka:latest
    container_name: Kafka-E_auction
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    restart: unless-stopped

  # ActiveMQ STOMP / Message Broker Container
  activemq:
    image: apache/activemq-classic:5.18.3
    container_name: activemq-E_auction
    # ports:
    #   - "61616:61616"
    #   - "61613:61613"
    #   - "8161:8161"
    restart: unless-stopped

  # Backend App Instance 1 (Load Balanced)
  app1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eauction-app-1
    ports:
      - "8080:8080"
      - "9091:9091"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/e_auction_dev?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ACTIVEMQ_RELAY_HOST=activemq
      - MANAGEMENT_SERVER_PORT=9091
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ADMIN_DEFAULT_EMAIL=${ADMIN_DEFAULT_EMAIL:-admin@eauction.com}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD}
      - ADMIN_DEFAULT_NAME=${ADMIN_DEFAULT_NAME:-Super Admin}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      - mysql
      - redis
      - kafka
      - activemq
      - elasticsearch
    restart: unless-stopped

  # Backend App Instance 2 (Load Balanced)
  app2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eauction-app-2
    ports:
      - "8081:8080"
      - "9093:9091"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/e_auction_dev?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ACTIVEMQ_RELAY_HOST=activemq
      - MANAGEMENT_SERVER_PORT=9091
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ADMIN_DEFAULT_EMAIL=${ADMIN_DEFAULT_EMAIL:-admin@eauction.com}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD}
      - ADMIN_DEFAULT_NAME=${ADMIN_DEFAULT_NAME:-Super Admin}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      - mysql
      - redis
      - kafka
      - activemq
      - elasticsearch
    restart: unless-stopped

  # React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eauction-frontend
    ports:
      - "3002:80"
    depends_on:
      - app1
      - app2
    restart: unless-stopped

  # Nginx Reverse Proxy & Load Balancer
  nginx:
    image: nginx:alpine
    container_name: nginx-E_auction
    ports:
      - "80:80"
    volumes:
      - ./backend/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - frontend
    restart: unless-stopped

  # Prometheus Container
  prometheus:
    image: prom/prometheus:latest
    container_name: Prometheus-E_auction
    ports:
      - "9090:9090"
    volumes:
      - ./backend/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  # Grafana Container
  grafana:
    image: grafana/grafana:latest
    container_name: Grafana-E_auction
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: Elasticsearch-E_auction
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    restart: unless-stopped

  # Logstash
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.3
    container_name: Logstash-E_auction
    volumes:
      - ./backend/logstash/pipeline:/usr/share/logstash/pipeline
    ports:
      - "5000:5000"
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.3
    container_name: Kibana-E_auction
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # Filebeat
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.3
    container_name: filebeat-auction
    user: root
    command: [ "--strict.perms=false" ]
    volumes:
      - ./backend/logs:/usr/share/filebeat/logs:ro
      - ./backend/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      - logstash
    restart: unless-stopped

volumes:
  mysql_data:
  filebeat_data: