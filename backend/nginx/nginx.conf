events {
    worker_connections 1024;
}

http {
    # Login: 5 requests/sec per IP
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

    # Bidding: 10 requests/sec per IP
    limit_req_zone $binary_remote_addr zone=bid_limit:10m rate=10r/s;

    server {
        listen 80;

        # Return 429 instead of default 503
        limit_req_status 429;

        # Login protection
        location /api/v1/auth/login {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://host.docker.internal:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Bid protection
        location /api/v1/bids/place {
            limit_req zone=bid_limit burst=10 nodelay;
            proxy_pass http://host.docker.internal:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Everything else
        location / {
            proxy_pass http://host.docker.internal:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}