events {
    worker_connections 1024;
}

http {
    # Define load balanced backend pool
    upstream backend_cluster {
        server app1:8080;
        server app2:8080;
    }

    # Login rate limit: 5 requests/sec per IP
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

    # Bidding rate limit: 10 requests/sec per IP
    limit_req_zone $binary_remote_addr zone=bid_limit:10m rate=10r/s;

    server {
        listen 80;

        # Return 429 Too Many Requests instead of default 503
        limit_req_status 429;

        # Login protection
        location /api/v1/auth/login {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://backend_cluster;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Bid protection
        location /api/v1/bids/place {
            limit_req zone=bid_limit burst=10 nodelay;
            proxy_pass http://backend_cluster;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Everything else (including WebSockets and general API routes)
        location / {
            proxy_pass http://backend_cluster;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # WebSocket support enabled across cluster nodes
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}