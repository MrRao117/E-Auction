events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Define load balanced backend pool with session affinity for SockJS
    upstream backend_cluster {
        ip_hash;
        server app1:8080;
        server app2:8080;
    }

    # Login rate limit: 5 requests/sec per IP
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

    # Bidding rate limit: 10 requests/sec per IP
    limit_req_zone $binary_remote_addr zone=bid_limit:10m rate=10r/s;

    server {
        listen 80;

        # Return 429 Too Many Requests instead of default 503
        limit_req_status 429;

        # Restrict public access to Prometheus actuator metrics endpoint
        location /actuator/prometheus {
            deny all;
            return 403;
        }

        # Login protection
        location /api/v1/auth/login {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://backend_cluster;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Bid protection
        location /api/v1/bids/place {
            limit_req zone=bid_limit burst=10 nodelay;
            proxy_pass http://backend_cluster;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # General API routes
        location /api/ {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket / STOMP support
        location /ws-auction/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # React Frontend Service (serves static Vite build files)
        location / {
            proxy_pass http://eauction-frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}