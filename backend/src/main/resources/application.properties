spring.application.name=backend
# Application Base URL (Change this in production via environment variables)
app.base-url=http://nginx-E_auction
server.port=${PORT:8080}

# Format for java.time.LocalDateTime and java.util.Date outputs
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata

# Serialize dates as formatted strings instead of numeric timestamps
spring.jackson.serialization.write-dates-as-timestamps=false

#spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:3306/${DB_NAME:e_auction_dev}?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
#spring.datasource.username=${DB_USER:root}
#spring.datasource.password=${DB_PASSWORD}
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#set to update
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.auto=update
#set it false later
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

jwt.secretKey=${JWT_SECRET_KEY}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# Spring doc Swagger paths
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Ensure controllers under /api/v1 are scanned for documentation
springdoc.packages-to-scan=com.eAuction.backend.controller
springdoc.paths-to-match=/api/**

#RAZORPAY KEYS
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}

#Redis Cache (Made dynamic to read from .env)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.data.redis.repositories.enabled=false
spring.cache.redis.time-to-live=45s


# -----------------------------------------------------------------------------
# ACTUATOR & MONITORING CONFIGURATION
# -----------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.group.liveness.include=db,redis,diskSpace
management.endpoint.health.group.readiness.include=db,redis,razorpay
management.endpoint.health.show-details=always

management.health.db.enabled=true
management.health.redis.enabled=true
management.health.diskspace.enabled=true

# Custom application info
info.app.name=e-Auction Platform Backend
info.app.description=Real-time e-Auction platform with Razorpay and Redis
info.app.version=1.0.0

# Default Admin Bootstrapper Configuration
app.admin.default-email=${ADMIN_DEFAULT_EMAIL:admin@eauction.com}
app.admin.default-password=${ADMIN_DEFAULT_PASSWORD:admin@123456}
app.admin.default-name=${ADMIN_DEFAULT_NAME:System Administrator}

#Kafka (Made dynamic to read from .env)
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:kafka:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=1

spring.kafka.consumer.group-id=eauction-bid-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer


#Resilience 4j for rate limiting
resilience4j.circuitbreaker.instances.razorpayService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.razorpayService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.razorpayService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.razorpayService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.razorpayService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.razorpayService.automaticTransitionFromOpenToHalfOpenEnabled=true

resilience4j.retry.instances.razorpayService.maxAttempts=3
resilience4j.retry.instances.razorpayService.waitDuration=500ms
resilience4j.retry.instances.razorpayService.enableExponentialBackoff=true
resilience4j.retry.instances.razorpayService.exponentialBackoffMultiplier=2
resilience4j.retry.instances.razorpayService.retryExceptions=com.eAuction.backend.exception.RazorpayServiceException,com.razorpay.RazorpayException,java.io.IOException,org.springframework.web.client.ResourceAccessException
resilience4j.bulkhead.instances.razorpayService.maxConcurrentCalls=10

resilience4j.timelimiter.instances.razorpayService.timeoutDuration=3s
resilience4j.timelimiter.instances.razorpayService.cancelRunningFuture=true


#Hikari CP tuning
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.pool-name=EAuctionHikariPool

#ActiveMQ STOMP Relay Host (Made dynamic to read from .env)
activemq.relay.host=${ACTIVEMQ_HOST:activemq}
activemq.client.login=${ACTIVEMQ_CLIENT_LOGIN:admin}
activemq.client.passcode=${ACTIVEMQ_CLIENT_PASSCODE:admin}
activemq.system.login=${ACTIVEMQ_SYSTEM_LOGIN:admin}
activemq.system.passcode=${ACTIVEMQ_SYSTEM_PASSCODE:admin}


cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}


# -----------------------------------------------------------------------------
# MULTIPART UPLOAD CONFIGURATION
# -----------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
