version: '3.8'

services:

  # Redis Container
  redis:
    image: redis:latest
    container_name: redis-E_auction
    ports:
      - "6379:6379"

  # Apache Kafka Container (KRaft mode)
  kafka:
    image: apache/kafka:latest
    container_name: Kafka-E_auction
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

  # Nginx Container
  nginx:
    image: nginx:alpine
    container_name: nginx-E_auction
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  # Prometheus Container
  prometheus:
    image: prom/prometheus:latest
    container_name: Prometheus-E_auction
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  # Grafana Container
  grafana:
    image: grafana/grafana:latest
    container_name: Grafana-E_auction
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped


    # 1. Elasticsearch (Search & Storage Engine)
  elasticsearch:
      image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
      container_name: Elasticsearch-E_auction
      environment:
        - discovery.type=single-node
        - xpack.security.enabled=false
        - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      ports:
        - "9200:9200"
      restart: unless-stopped

    # 2. Logstash (Log Processing Pipeline)
  logstash:
      image: docker.elastic.co/logstash/logstash:8.11.3
      container_name: Logstash-E_auction
      volumes:
        - ./logstash/pipeline:/usr/share/logstash/pipeline
      ports:
        - "5000:5000"
      depends_on:
        - elasticsearch
      restart: unless-stopped

    # 3. Kibana (Search & Dashboard UI)
  kibana:
      image: docker.elastic.co/kibana/kibana:8.11.3
      container_name: Kibana-E_auction
      ports:
        - "5601:5601"
      environment:
        - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      depends_on:
        - elasticsearch
      restart: unless-stopped

    # 4. Filebeat (Log Shipper)
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.3
    container_name: filebeat-auction
    user: root
    command: [ "--strict.perms=false" ]
    volumes:
      - ./logs:/usr/share/filebeat/logs:ro
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      - logstash
    restart: unless-stopped

volumes:
  filebeat_data: