# Backend App Instance 1 (Load Balanced)
app1:
  build:
    context: ./backend
    dockerfile: Dockerfile
  container_name: eauction-app-1
  ports:
    - "8080:8080"
  environment:
    - SPRING_PROFILES_ACTIVE=prod
    - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/e_auction_dev?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
    - SPRING_DATASOURCE_USERNAME=root
    - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
    - SPRING_DATA_REDIS_HOST=redis
    - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    - ACTIVEMQ_RELAY_HOST=activemq
    - MANAGEMENT_SERVER_PORT=9091
    - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    - ADMIN_DEFAULT_EMAIL=${ADMIN_DEFAULT_EMAIL:-admin@eauction.com}
    - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD}
    - ADMIN_DEFAULT_NAME=${ADMIN_DEFAULT_NAME:-Super Admin}
    - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
    - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
    - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
  depends_on:
    - mysql
    - redis
    - kafka
    - activemq
    - elasticsearch
  restart: unless-stopped

