filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /usr/share/filebeat/logs/eauction-backend.log
    json.keys_under_root: true
    json.overwrite_keys: true
    json.error_key: "json_error"

output.logstash:
  hosts: ["logstash:5000"]

logging.to_files: false
logging.to_stderr: true